name: SaveEditorHarness
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: HVM_DISABLE_ENGINE
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SaveEditorHarness:
    type: application
    platform: iOS
    sources:
      - EditorHarness.swift
      - PlayerHarness.swift
      - ../../../app/HydrogenVM/RunView.swift
      - ../../../app/HydrogenVM/CrashReport.swift
      - ../../../app/HydrogenVM/ConsoleReport.swift
      - ../../../app/HydrogenVM/PlayerGeometry.swift
      - ../../../app/HydrogenVM/PlayerActivity.swift
      - ../../../app/HydrogenVM/PlayerOverlay.swift
      - ../../../app/HydrogenVM/PlayerOrientation.swift
      - ../../../app/HydrogenVM/PlayerViewport.swift
      - ../../../app/HydrogenVM/GameKeyboard.swift
      - ../../../app/HydrogenVM/GamePhotoPicker.swift
      - ../../../app/HydrogenVM/GameDocumentPicker.swift
      - ../../../app/HydrogenVM/GameMoviePlayer.swift
      - ../../../app/HydrogenVM/FileBrowser.swift
      - ../../../app/HydrogenVM/RecentSaveFiles.swift
      - ../../../app/HydrogenVM/BinaryEditor.swift
      - ../../../app/HydrogenVM/FileEditorSession.swift
      - ../../../app/HydrogenVM/SaveFileStore.swift
      - ../../../app/HydrogenVM/SaveTextCodec.swift
      - ../../../app/HydrogenVM/SaveCompression.swift
      - ../../../app/HydrogenVM/SaveSnapshotStore.swift
      - ../../../app/HydrogenVM/SQLiteEditStore.swift
      - ../../../app/HydrogenVM/SaveConfigLine.swift
      - ../../../app/HydrogenVM/JSONSaveDocument.swift
      - ../../../app/HydrogenVM/PlistSaveDocument.swift
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: PhotosUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfull.HydrogenVM.EditorHarness
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/MemoryBridge.h
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SaveEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EditorUITests.swift
      - PlayerUITests.swift
      - PlayerGestureUITests.m
    dependencies:
      - target: SaveEditorHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfull.HydrogenVM.EditorUITests
        TEST_TARGET_NAME: SaveEditorHarness
  PlayerViewportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlayerViewportTests.swift
    dependencies:
      - target: SaveEditorHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfull.HydrogenVM.PlayerViewportTests
  ColdStartPromptUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ColdStartPromptUITests.swift
    dependencies:
      - target: SaveEditorHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfull.HydrogenVM.ColdStartPromptUITests
        TEST_TARGET_NAME: SaveEditorHarness
schemes:
  ColdStartPrompt:
    build:
      targets:
        SaveEditorHarness: all
    test:
      targets:
        - ColdStartPromptUITests
  SaveEditorHarness:
    build:
      targets:
        SaveEditorHarness: all
    test:
      targets:
        - SaveEditorUITests
        - PlayerViewportTests
