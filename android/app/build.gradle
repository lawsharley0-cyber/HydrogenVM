plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hydrogenvm.android'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.hydrogenvm.android'
        // libicu.so (text handling in the emulator) is part of the NDK from Android 12.
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the build's debug key so the APK installs directly (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Release lint downloads extra tools at build time; this project has no Android library code to check.
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
