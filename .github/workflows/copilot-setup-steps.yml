name: Copilot Setup Steps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - name: Install Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm cmake ninja-build zlib1g-dev libssl-dev libsqlite3-dev pkg-config libavformat-dev libavcodec-dev libavutil-dev ffmpeg uuid-dev python3 libstdc++-14-dev
      - name: Build and Test C++
        run: |
          cmake -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
