name: Clash Royale investigation

on:
  push:
    branches: [gemini-merge]
    paths:
      - '.github/workflows/clash-royale.yml'
      - 'tools/clash_royale_probe.py'
      - 'src/**'
      - 'tests/runner/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clash-investigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Fetch known regression fixtures
        uses: actions/checkout@v4
        with:
          ref: ceba289b57cbda0e229e778966f195bcc1437fa0
          path: regression-fixtures
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AngryBirds_v1.0_os30.ipa
            /Tiny_Tower_v1.0_os30.ipa
            /Art_Of_Glow_v1.1.2_os313.ipa
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang llvm cmake ninja-build zlib1g-dev libsqlite3-dev python3-pil ccache
      - name: Cache C++ compilation
        uses: actions/cache@v4
        with:
          path: .ccache
          key: clash-ccache-${{ runner.os }}-${{ hashFiles('src/**', 'tests/runner/**', 'CMakeLists.txt') }}
          restore-keys: clash-ccache-${{ runner.os }}-
      - name: Validate probe syntax
        run: python3 -m py_compile tools/clash_royale_probe.py
      - name: Inspect pinned client and inventory assets
        run: python3 tools/clash_royale_probe.py --out clash-report
      - name: Build current engine
        run: |
          cmake -S . -B build-clash -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-clash --target hvm hvm_tests hvm_machodump --parallel 2
      - name: Runtime regression checks
        run: build-clash/hvm_tests fulltest
      - name: Trace Clash Royale startup
        run: |
          set +e
          timeout 40s build-clash/hvm run clash-report/client.ipa --home clash-trace-home --run-for 10 --trace --report clash-report/startup-trace.json > clash-report/startup-trace.txt 2>&1
          result=$?
          set -e
          echo "Trace process exit: $result"
          tail -180 clash-report/startup-trace.txt
      - name: Strict and exploratory compatibility runs
        run: |
          python3 tools/compat.py scan clash-report/client.ipa regression-fixtures/AngryBirds_v1.0_os30.ipa regression-fixtures/Tiny_Tower_v1.0_os30.ipa regression-fixtures/Art_Of_Glow_v1.1.2_os313.ipa --hvm build-clash/hvm --out clash-compat --seconds 15 --jobs 1 --relaunch
          python3 -c 'import json; d=json.load(open("clash-compat/results.json")); assert len(d["apps"]) == 4, "Expected Clash Royale and three regression fixtures"'
          cat clash-compat/REPORT.md
          cat clash-compat/results.json
      - name: Publish investigation summary
        if: always()
        run: |
          if test -f clash-compat/REPORT.md; then cat clash-compat/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f clash-report/metadata.json; then
            echo '### Pinned client metadata' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat clash-report/metadata.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save diagnostics (excludes IPA, extracted app, and game saves)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-royale-investigation
          retention-days: 14
          if-no-files-found: warn
          path: |
            clash-report/*.json
            clash-report/*.txt
            clash-compat/REPORT.md
            clash-compat/results.json
            clash-compat/runs/**/*.json
            clash-compat/shots/*.png
