name: Compat harness

# Linux compatibility gate: existing CPU/runtime/Python suites plus a hashed
# IPA smoke. This file is additive. It does not publish ci-reports and it
# does not grant contents: write.
#
# Linux Actions is executing. On 6af9976 the compat job passed
# (run 39646706013) and the Linux CI job published
# runs/20261021-175201-39646696896-linux (run 39646696896).
# The empty-step failure on 07fabbb (run 39633887764) was real; it is
# historical. The macOS job in ci.yml is still skipped unless [mac],
# workflow_dispatch, or the Monday schedule.
# checkout and upload-artifact are pinned to the v4 commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Linux headless harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm cmake ninja-build zlib1g-dev libssl-dev libsqlite3-dev uuid-dev python3 g++ libstdc++-14-dev \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri python3-pil
          clang++ --version | head -1
      - name: Harness self-tests
        run: python3 -m unittest discover -s tools/compat_harness/tests -v
      - name: Build engine and guest tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          ninja -C build hvm hvm_tests hvm_decodecheck
          tools/build_tests.sh build/tests
      - name: Heap allocation regressions
        run: |
          cmake --build build --target hvm_heap_tests
          build/hvm_heap_tests
      - name: Run compatibility harness
        env:
          HVM_ALLOW_LEGACY_IPAS: "1"
        run: |
          python3 tools/hvm_compat.py run \
            --build-dir build \
            --out build/compat-report \
            --baseline docs/dev-system/baselines/linux-headless.json \
            --require-resolved \
            --allow-legacy-repo
      - name: GPU backend matches the software rasterizer
        # hvm run --gpu forwards GLES to Mesa (llvmpipe, EGL surfaceless).
        run: |
          python3 tools/gen_hostgl.py --check
          python3 tools/gpu_compare.py --hvm build/hvm --seconds 12 --out build/gpu-compare \
            Tiny_Tower_v1.0_os30.ipa AngryBirds_v1.0_os30.ipa Art_Of_Glow_v1.1.2_os313.ipa
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-report
          path: |
            build/compat-report/report.json
            build/compat-report/diff.json
            build/gpu-compare/*.png
            build/gpu-compare/*.json
          if-no-files-found: warn
