name: Plist metadata regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq g++ clang libstdc++-14-dev
      - name: Synthetic Plist metadata and ASan/UBSan regression
        run: CXX=g++ tools/test_plist.sh
