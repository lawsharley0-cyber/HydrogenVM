name: File editor Apple validation
on:
  pull_request:
    paths: ['app/**', 'tools/tests/swift/**', 'tools/tests/swiftui/**', '.github/workflows/file-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Persistence regression tests (Swift 6)
        run: |
          mkdir -p build/file-editor
          xcrun swiftc -swift-version 6 -o build/file-editor/tests \
            app/HydrogenVM/SaveFileStore.swift app/HydrogenVM/SaveCompression.swift \
            app/HydrogenVM/SaveTextCodec.swift app/HydrogenVM/SQLiteEditStore.swift \
            app/HydrogenVM/SaveSnapshotStore.swift app/HydrogenVM/SaveConfigLine.swift \
            app/HydrogenVM/JSONSaveDocument.swift app/HydrogenVM/PlistSaveDocument.swift \
            tools/tests/swift/SaveFileStoreTests.swift -lz -lsqlite3
          set -o pipefail
          build/file-editor/tests 2>&1 | tee build/file-editor/persistence.log
      - name: Player geometry and lifecycle regression tests (Swift 6)
        run: |
          xcrun swiftc -swift-version 6 -o build/file-editor/player-tests \
            app/HydrogenVM/PlayerGeometry.swift app/HydrogenVM/PlayerActivity.swift \
            tools/tests/swift/PlayerTests.swift
          set -o pipefail
          build/file-editor/player-tests 2>&1 | tee build/file-editor/player-models.log
      - name: Generate project
        if: ${{ !cancelled() }}
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
          cd app && xcodegen
      - name: Compile iOS shell (unsigned simulator)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project app/HydrogenVM.xcodeproj -target HydrogenVM \
            -configuration Release -sdk iphonesimulator \
            SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 \
            SYMROOT="$PWD/build/file-editor/xbuild" CODE_SIGNING_ALLOWED=NO \
            build >build/file-editor/simulator.log 2>&1 || {
              tail -150 build/file-editor/simulator.log
              exit 1
            }
      - name: Crash journal recovery with the actual engine bridge
        timeout-minutes: 20
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices=json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime: continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator")')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          cp app/HydrogenVM/CrashReport.swift "$RUNNER_TEMP/hvm-current-crash-report.swift"
          trap 'cp "$RUNNER_TEMP/hvm-current-crash-report.swift" app/HydrogenVM/CrashReport.swift' EXIT
          git fetch --no-tags --depth=1 origin 4c09fa4708fe48796f3255695e97aef685087042
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('app/HydrogenVM/CrashReport.swift')
          current = path.read_text()
          old = subprocess.check_output(['git', 'show', '4c09fa4708fe48796f3255695e97aef685087042:app/HydrogenVM/CrashReport.swift'], text=True)
          start, end = '    static func recover()', '    static func clearPending()'
          assert current.count(start) == old.count(start) == 1
          assert current.count(end) == old.count(end) == 1
          # Keep current unrelated session APIs so the actual old recovery body
          # compiles against the candidate caller; the tested method is verbatim.
          path.write_text(current[:current.index(start)] + old[old.index(start):old.index(end)] + current[current.index(end):])
          PY
          if xcodebuild -project app/HydrogenVM.xcodeproj -scheme HydrogenVMJournalTests \
            -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" \
            SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 ENABLE_TESTABILITY=YES \
            SYMROOT="$PWD/build/file-editor/xbuild" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -resultBundlePath build/file-editor/CrashJournalBefore.xcresult \
            test >build/file-editor/crash-journal-before.log 2>&1; then
            echo "Previous recovery unexpectedly passed the regression"
            exit 1
          fi
          tail -100 build/file-editor/crash-journal-before.log
          grep -E 'testMalformedPendingAndSignalArePreserved.*failed' build/file-editor/crash-journal-before.log
          grep -E 'testSignalWithoutPendingMetadataIsRecovered.*failed' build/file-editor/crash-journal-before.log
          cp "$RUNNER_TEMP/hvm-current-crash-report.swift" app/HydrogenVM/CrashReport.swift
          trap - EXIT
          xcodebuild -project app/HydrogenVM.xcodeproj -scheme HydrogenVMJournalTests \
            -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" \
            SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 ENABLE_TESTABILITY=YES \
            SYMROOT="$PWD/build/file-editor/xbuild" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO \
            -resultBundlePath build/file-editor/CrashJournalTests.xcresult \
            test >build/file-editor/crash-journal.log 2>&1 || {
              tail -150 build/file-editor/crash-journal.log
              exit 1
            }
      - name: Exercise save and close flows on an iPhone simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodegen --spec tools/tests/swiftui/project.yml --project tools/tests/swiftui
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices=json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime: continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator")')
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project tools/tests/swiftui/SaveEditorHarness.xcodeproj \
            -scheme SaveEditorHarness -destination "platform=iOS Simulator,id=$UDID" \
            -parallel-testing-enabled NO -resultBundlePath build/file-editor/EditorUITests.xcresult \
            test >build/file-editor/ui-tests.log 2>&1 || {
              tail -150 build/file-editor/ui-tests.log
              exit 1
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-editor-validation
          path: |
            build/file-editor/*.log
            build/file-editor/EditorUITests.xcresult
            build/file-editor/CrashJournalTests.xcresult
            build/file-editor/CrashJournalBefore.xcresult
