name: PCM decoder regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pcm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang libstdc++-14-dev
      - name: Synthetic PCM and ASan/UBSan regression
        run: tools/test_pcm_decode.sh
