name: CI

# Linux runs on every push. The macOS job (Apple-toolchain engine build + speed
# on Apple Silicon, Xcode device/simulator builds, simulator run) costs 10x the
# Actions minutes on a private repo, so it runs when a commit message contains
# "[mac]", on manual dispatch, or once a week.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read   # Build and test jobs never receive a repository-write token.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — tests, report, CoreMark
    runs-on: ubuntu-24.04
    env:
      HVM_LD64: /home/runner/cctools/bin/arm-apple-darwin11-ld
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm cmake ninja-build zlib1g-dev libssl-dev libsqlite3-dev pkg-config libavformat-dev libavcodec-dev libavutil-dev ffmpeg uuid-dev python3 python3-jsonschema
          command -v llvm-nm && llvm-nm --version | head -1
      - name: Verify IPA packaging checks
        run: python3 -m unittest discover -s tools/tests -p 'test_verify_ipa.py'
      - name: Synthetic Plist metadata and ASan/UBSan regression
        run: CXX=g++ tools/test_plist.sh
      - name: Native guest-worker lifetime under ASan/UBSan
        run: bash tools/test_thread_lifetime.sh
      - name: Evidence contract tests
        run: python3 -m unittest discover -s tools/tests -p 'test_hvm_evidence.py'
      - name: Agent queue tests
        run: python3 -m unittest discover -s tools/tests -p 'test_agent_queue.py'
      - name: Probe tainted-run tests
        run: python3 -m unittest discover -s tools/tests -p 'test_hvm_probe_tainted.py'
      - name: Cache ld64 (cctools-port)
        id: cctools
        uses: actions/cache@v4
        with:
          path: /home/runner/cctools
          key: cctools-${{ runner.os }}-${{ hashFiles('tools/build_cctools.sh') }}
      - name: Build ld64
        if: steps.cctools.outputs.cache-hit != 'true'
        run: tools/build_cctools.sh /home/runner/cctools
      - name: Test + performance report
        run: python3 tools/hvm_report.py --out report
      - name: Full tools suite including Test Lab integration
        env:
          HVM_TESTLAB_TOOLCHAIN: "1"
        run: python3 -m unittest discover -s tools/tests
      - name: Guest termination watchdog is a failed run
        run: python3 tools/test_shutdown_watchdog.py --hvm build/hvm
      - name: HostGL sequential process lifetime
        run: build/hvm_gl_lifetime_tests
      - name: Host AAC decoder comparison
        run: python3 tools/test_m4a_audio.py --hvm-tests build/hvm_tests --out report/m4a.json
      - name: Upload report and test apps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-report
          path: |
            report/
            build/ios/*.app
          if-no-files-found: warn
      - name: Upload test apps for macOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-apps
          path: build/ios/*.app

  macos:
    name: macOS — Apple Silicon speed, Xcode build, simulator run
    runs-on: macos-26
    needs: linux
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[mac]')
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install cmake ninja llvm lld xcodegen
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-apps
          path: build/ios
      - name: Test + performance report (Apple clang, Apple Silicon)
        run: |
          export CC_GUEST="$(brew --prefix llvm)/bin/clang"
          export PATH="$(brew --prefix lld)/bin:$PATH"
          xcodebuild -version
          python3 tools/hvm_report.py --prebuilt-apps --out report
      - name: Generate Xcode project
        working-directory: app
        run: xcodegen
      - name: Build for device (unsigned, Release)
        working-directory: app
        run: |
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >device-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" device-build.log | head -200
          # Surface compiler errors as public annotations so they are readable without log access.
          grep -E "error:" device-build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error title=xcodebuild::${line//%/%25}"
          done
          exit $rc
      - name: Package unsigned IPA for sideloading
        working-directory: app
        run: |
          APP="xbuild/Release-iphoneos/HydrogenVM.app"
          test -d "$APP"
          rm -f HydrogenVM-unsigned.ipa HydrogenVM-unsigned.manifest.json HydrogenVM-unsigned.manifest.sha256
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "$PWD/../HydrogenVM-unsigned.ipa" Payload)
          unzip -l HydrogenVM-unsigned.ipa | tail -1
          python3 ../tools/verify_ipa.py HydrogenVM-unsigned.ipa --out HydrogenVM-unsigned.manifest.json --source-commit "$(git rev-parse HEAD)"
      - name: Upload validated unsigned device package
        # Right after packaging, so the .ipa can be downloaded while the
        # simulator diagnostics below are still running.
        uses: actions/upload-artifact@v4
        with:
          name: HydrogenVM-device-ipa
          if-no-files-found: error
          path: |
            app/HydrogenVM-unsigned.ipa
            app/HydrogenVM-unsigned.manifest.json
            app/HydrogenVM-unsigned.manifest.sha256
      - name: Build for simulator
        working-directory: app
        run: |
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphonesimulator SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 \
            SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >sim-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim-build.log | head -200
          exit $rc
      - name: Run UIKit test app inside HydrogenVM (simulator)
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app build/ios/UIKitTest.app \
            "ALL CHECKS PASSED" "70,350@0.3;230,350@0.5" sim-out
      - name: Run a GLES game on the GPU path inside HydrogenVM (simulator)
        # Tiny Tower (GLES 1.1, in-repo fixture). Diagnostic: the screenshot and
        # console go to ci-reports under simulator-gl/; it does not gate the build.
        continue-on-error: true
        run: |
          rm -rf build/gl && mkdir -p build/gl
          unzip -q Tiny_Tower_v1.0_os30.ipa -d build/gl
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "build/gl/Payload/Tiny Tower.app" \
            "GPU: presented frame 60 directly" "160,240@6" sim-gl-out
      - name: A landscape GLES game on the GPU path (simulator)
        # Angry Birds (GLES 1.1, landscape, in-repo fixture): the GPU layer must be rotated like the guest view.
        continue-on-error: true
        run: |
          rm -rf build/gl-ab && mkdir -p build/gl-ab
          unzip -q AngryBirds_v1.0_os30.ipa -d build/gl-ab
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "$(ls -d build/gl-ab/Payload/*.app | head -1)" \
            "GPU: presented frame 600 directly" "" sim-gl-landscape-out
      - name: Run Test all games batch workflow in simulator
        continue-on-error: true
        env:
          SIMCTL_CHILD_HVM_TEST_ALL_GAMES: "1"
          SIMCTL_CHILD_HVM_TEST_ALL_GAMES_MODE: "both"
          SIMCTL_CHILD_HVM_TEST_ALL_GAMES_SECONDS: "5"
          SIMCTL_CHILD_HVM_TEST_ALL_GAMES_OUT: "sim-batch-out"
        run: |
          mkdir -p sim-batch-out
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app build/ios/UIKitTest.app \
            "[hvm-batch-exit]" "" sim-batch-out
          if [ -f sim-batch-out/batch_report.json ]; then
            python3 tools/triage.py ingest sim-batch-out/batch_report.json
          fi
      - name: Same game with GLES 1.1 emulated on an ES 2 context (simulator)
        continue-on-error: true
        env:
          SIMCTL_CHILD_HVM_GL1_EMULATE: "1"
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "build/gl/Payload/Tiny Tower.app" \
            "GPU: presented frame 60 directly" "160,240@6" sim-gl-emu-out
      - name: Collect macOS diagnostics for artifacts and trusted publishing
        if: always()
        run: |
          mkdir -p report/xcode report/simulator
          cp app/device-build.log app/sim-build.log report/xcode/ 2>/dev/null || true
          grep -E "error:|warning:" app/device-build.log app/sim-build.log 2>/dev/null | sort -u | head -300 > report/xcode/diagnostics.txt || true
          cp -R sim-out/. report/simulator/ 2>/dev/null || true
          mkdir -p report/simulator-gl && cp -R sim-gl-out/. report/simulator-gl/ 2>/dev/null || true
          mkdir -p report/simulator-gl-emu && cp -R sim-gl-emu-out/. report/simulator-gl-emu/ 2>/dev/null || true
          mkdir -p report/simulator-gl-landscape && cp -R sim-gl-landscape-out/. report/simulator-gl-landscape/ 2>/dev/null || true
          mkdir -p report/simulator-batch && cp -R sim-batch-out/. report/simulator-batch/ 2>/dev/null || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-results
          path: |
            report/
            app/device-build.log
            app/sim-build.log
            sim-out/
          if-no-files-found: warn

  # Run report publishing only after trusted events, in jobs with narrowly
  # scoped write access. Pull-request builds keep read-only GitHub tokens.
  publish-linux-report:
    name: Publish Linux report (trusted main)
    runs-on: ubuntu-24.04
    needs: [linux]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux diagnostic artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-report
          path: trusted-report
      - name: Publish to ci-reports
        run: |
          test -d trusted-report/report
          tools/publish_report.sh trusted-report/report linux

  publish-macos-report:
    name: Publish macOS report (trusted main)
    runs-on: ubuntu-24.04
    needs: [macos]
    if: ${{ always() && needs.macos.result != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS diagnostic artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-results
          path: trusted-report
      - name: Publish to ci-reports
        run: |
          test -d trusted-report/report
          tools/publish_report.sh trusted-report/report macos
