name: CI

# Linux runs on every push. The macOS job (Apple-toolchain engine build + speed
# on Apple Silicon, Xcode device/simulator builds, simulator run) costs 10x the
# Actions minutes on a private repo, so it runs when a commit message contains
# "[mac]", on manual dispatch, or once a week.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write   # tools/publish_report.sh pushes results to the ci-reports branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — tests, report, CoreMark
    runs-on: ubuntu-24.04
    env:
      HVM_LD64: /home/runner/cctools/bin/arm-apple-darwin11-ld
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm cmake ninja-build zlib1g-dev libssl-dev libsqlite3-dev uuid-dev python3
          command -v llvm-nm && llvm-nm --version | head -1
      - name: Verify IPA packaging checks
        run: python3 -m unittest discover -s tools/tests -p 'test_verify_ipa.py'
      - name: Cache ld64 (cctools-port)
        id: cctools
        uses: actions/cache@v4
        with:
          path: /home/runner/cctools
          key: cctools-${{ runner.os }}-${{ hashFiles('tools/build_cctools.sh') }}
      - name: Build ld64
        if: steps.cctools.outputs.cache-hit != 'true'
        run: tools/build_cctools.sh /home/runner/cctools
      - name: Test + performance report
        run: python3 tools/hvm_report.py --out report
      - name: Publish report to ci-reports branch
        if: always()
        run: tools/publish_report.sh report linux
      - name: Upload report and test apps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-report
          path: |
            report/
            build/ios/*.app
          if-no-files-found: warn
      - name: Upload test apps for macOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-apps
          path: build/ios/*.app

  macos:
    name: macOS — Apple Silicon speed, Xcode build, simulator run
    runs-on: macos-26
    needs: linux
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[mac]')
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install cmake ninja llvm lld xcodegen
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-apps
          path: build/ios
      - name: Test + performance report (Apple clang, Apple Silicon)
        run: |
          export CC_GUEST="$(brew --prefix llvm)/bin/clang"
          export PATH="$(brew --prefix lld)/bin:$PATH"
          xcodebuild -version
          python3 tools/hvm_report.py --prebuilt-apps --out report
      - name: Generate Xcode project
        working-directory: app
        run: xcodegen
      - name: Build for device (unsigned, Release)
        working-directory: app
        run: |
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >device-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" device-build.log | head -200
          # Surface compiler errors as public annotations so they are readable without log access.
          grep -E "error:" device-build.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error title=xcodebuild::${line//%/%25}"
          done
          exit $rc
      - name: Package unsigned IPA for sideloading
        working-directory: app
        run: |
          APP="xbuild/Release-iphoneos/HydrogenVM.app"
          test -d "$APP"
          rm -f HydrogenVM-unsigned.ipa HydrogenVM-unsigned.manifest.json HydrogenVM-unsigned.manifest.sha256
          rm -rf ipa && mkdir -p ipa/Payload && cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "$PWD/../HydrogenVM-unsigned.ipa" Payload)
          unzip -l HydrogenVM-unsigned.ipa | tail -1
          python3 ../tools/verify_ipa.py HydrogenVM-unsigned.ipa --out HydrogenVM-unsigned.manifest.json --source-commit "$(git rev-parse HEAD)"
      - name: Build for simulator
        working-directory: app
        run: |
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphonesimulator SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 \
            SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >sim-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim-build.log | head -200
          exit $rc
      - name: Run UIKit test app inside HydrogenVM (simulator)
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app build/ios/UIKitTest.app \
            "ALL CHECKS PASSED" "70,350@0.3;230,350@0.5" sim-out
      - name: Upload validated unsigned device package
        uses: actions/upload-artifact@v4
        with:
          name: HydrogenVM-device-ipa
          if-no-files-found: error
          path: |
            app/HydrogenVM-unsigned.ipa
            app/HydrogenVM-unsigned.manifest.json
            app/HydrogenVM-unsigned.manifest.sha256
      - name: Publish report to ci-reports branch
        if: always()
        run: |
          mkdir -p report/xcode report/simulator
          cp app/device-build.log app/sim-build.log report/xcode/ 2>/dev/null || true
          grep -E "error:|warning:" app/device-build.log app/sim-build.log 2>/dev/null | sort -u | head -300 > report/xcode/diagnostics.txt || true
          cp -R sim-out/. report/simulator/ 2>/dev/null || true
          tools/publish_report.sh report macos
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-results
          path: |
            report/
            app/device-build.log
            app/sim-build.log
            sim-out/
          if-no-files-found: warn
