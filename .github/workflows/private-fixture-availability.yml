name: Private fixture parity (trusted main)

# Pre-removal gate. Existing public CI and real-app consumers remain unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-fixture-parity
  cancel-in-progress: false

jobs:
  linux:
    if: >-
      github.repository == 'lawsharley0-cyber/HydrogenVM' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      HVM_ALLOW_LEGACY_IPAS: "0"
    steps:
      - name: Set private fixture path after runner startup
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("hvm-private-fixtures-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          value = str(root)
          if "\n" in value or "\r" in value:
              raise SystemExit("ERROR: invalid runner temporary directory")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("HVM_FIXTURE_ROOT=" + value + "\n")
          PY
      - name: Check out this trusted main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate configuration without printing private IDs
        env:
          WIF_PROVIDER: ${{ vars.HVM_WIF_PROVIDER }}
          READER_ACCOUNT: ${{ vars.HVM_FIXTURE_SERVICE_ACCOUNT }}
          HVM_DRIVE_FOLDER_ID: ${{ secrets.HVM_DRIVE_FOLDER_ID }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          folder = os.environ["HVM_DRIVE_FOLDER_ID"]
          if re.fullmatch(r"[A-Za-z0-9_-]{10,}", folder):
              print("::add-mask::" + folder)
          checks = {
              "WIF provider": re.fullmatch(r"projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+", os.environ["WIF_PROVIDER"]),
              "reader account": re.fullmatch(r"[A-Za-z0-9_-]+@[A-Za-z0-9_-]+\.iam\.gserviceaccount\.com", os.environ["READER_ACCOUNT"]),
              "restricted folder": re.fullmatch(r"[A-Za-z0-9_-]{10,}", folder),
          }
          if not all(checks.values()):
              print("ERROR: required private fixture configuration is missing or invalid")
              sys.exit(1)
          PY
      - name: Existing synthetic downloader and resolver regressions
        run: |
          python3 -m unittest discover -s tools/compat_harness/tests -v
      - name: Use the existing keyless reader identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.HVM_WIF_PROVIDER }}
          service_account: ${{ vars.HVM_FIXTURE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Stage all three exact-hash private fixtures
        id: stage
        env:
          HVM_DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          HVM_DRIVE_FOLDER_ID: ${{ secrets.HVM_DRIVE_FOLDER_ID }}
        run: python3 tools/fetch_private_fixtures.py --root "$HVM_FIXTURE_ROOT"
      - name: Independently resolve every required fixture without legacy fallback
        id: resolve
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from compat_harness.manifest import default_manifest_path, load_manifest, resolve_app
          expected = {"angry-birds", "tiny-tower", "art-of-glow"}
          required = [a for a in load_manifest(default_manifest_path())["apps"] if not a.get("optional", False)]
          if {a["id"] for a in required} != expected:
              raise SystemExit("ERROR: required fixture set changed; review the migration gate")
          for app in required:
              result = resolve_app(app, repo=os.getcwd(), fixture_root=os.environ["HVM_FIXTURE_ROOT"], allow_legacy=False)
              if result["status"] != "resolved" or result["source"] != "fixture-root" or result["actualSha256"] != app["sha256"]:
                  raise SystemExit("ERROR: required private fixture did not resolve with its expected hash")
          print("Verified 3/3 required fixtures from fixture-root; legacy fallback disabled")
          PY
      - name: Install Linux parity toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld llvm cmake ninja-build zlib1g-dev libssl-dev libsqlite3-dev pkg-config libavformat-dev libavcodec-dev libavutil-dev ffmpeg uuid-dev python3 g++ libstdc++-14-dev libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri python3-pil
          python3 -c "import ctypes; ctypes.CDLL('libEGL.so.1')"
      - name: Build engine and all CPU guest tests
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          ninja -C build hvm hvm_tests hvm_decodecheck hvm_heap_tests
          tools/build_tests.sh build/tests
      - name: Heap allocation regressions
        id: heap
        run: build/hvm_heap_tests
      - name: Full compatibility and unchanged baseline using private fixtures
        id: compat
        run: |
          python3 tools/hvm_compat.py run --build-dir build \
            --out "$HVM_FIXTURE_ROOT/work/compat" \
            --baseline docs/dev-system/baselines/linux-headless.json \
            --require-resolved --no-legacy-repo
      - name: Build the existing ARMv7 iOS guest linker
        run: |
          tools/build_cctools.sh "$RUNNER_TEMP/hvm-cctools"
          echo "HVM_LD64=$RUNNER_TEMP/hvm-cctools/bin/arm-apple-darwin11-ld" >> "$GITHUB_ENV"
      - name: Full Test Lab integration suite
        id: testlab
        run: |
          python3 -m unittest discover -s tools/testlab_schema/tests -v
          python3 tools/hvm_testlab.py run --hvm build/hvm --out "$HVM_FIXTURE_ROOT/work/testlab"
          python3 tools/hvm_testlab.py validate "$HVM_FIXTURE_ROOT/work/testlab/testlab_report.json"
      - name: GPU versus software parity for all three fixtures
        id: gpu
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gen_hostgl.py --check
          python3 tools/gpu_compare.py --hvm build/hvm --seconds 12 --out "$HVM_FIXTURE_ROOT/work/gpu" \
            "$HVM_FIXTURE_ROOT/ipas/Tiny_Tower_v1.0_os30.ipa" \
            "$HVM_FIXTURE_ROOT/ipas/AngryBirds_v1.0_os30.ipa" \
            "$HVM_FIXTURE_ROOT/ipas/Art_Of_Glow_v1.1.2_os313.ipa" | tee "$HVM_FIXTURE_ROOT/work/gpu.log"
          test "$(grep -c '^ok ' "$HVM_FIXTURE_ROOT/work/gpu.log")" -eq 3
          ! grep -q '^skip ' "$HVM_FIXTURE_ROOT/work/gpu.log"
      - name: GLES 1.1 on ES 2 parity for all three fixtures
        id: gpu_emu
        shell: bash
        env:
          HVM_GL1_EMULATE: "1"
        run: |
          set -euo pipefail
          python3 tools/gpu_compare.py --hvm build/hvm --seconds 12 --out "$HVM_FIXTURE_ROOT/work/gpu-emu" \
            "$HVM_FIXTURE_ROOT/ipas/Tiny_Tower_v1.0_os30.ipa" \
            "$HVM_FIXTURE_ROOT/ipas/AngryBirds_v1.0_os30.ipa" \
            "$HVM_FIXTURE_ROOT/ipas/Art_Of_Glow_v1.1.2_os313.ipa" | tee "$HVM_FIXTURE_ROOT/work/gpu-emu.log"
          test "$(grep -c '^ok ' "$HVM_FIXTURE_ROOT/work/gpu-emu.log")" -eq 3
          ! grep -q '^skip ' "$HVM_FIXTURE_ROOT/work/gpu-emu.log"
      - name: Build the existing synthetic UIKit guest for simulator parity
        id: uikit_build
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "tools")
          from hvm_report import build_ios_app
          out = str(pathlib.Path("build/ios").resolve())
          rc, diagnostics = build_ios_app("UIKitTest", ["@uikit"], out)
          if rc:
              print(diagnostics)
              raise SystemExit(rc)
          if not pathlib.Path(out, "UIKitTest.app", "UIKitTest").is_file():
              raise SystemExit("ERROR: synthetic UIKit guest executable missing")
          PY
      - name: Transfer only the synthetic UIKit guest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-parity-synthetic-uikit
          path: build/ios/UIKitTest.app/
          if-no-files-found: error
          retention-days: 1
      - name: Validate and retain bounded Linux parity evidence
        if: always()
        env:
          PARITY_STAGE: ${{ steps.stage.outcome }}
          PARITY_RESOLVE: ${{ steps.resolve.outcome }}
          PARITY_BUILD: ${{ steps.build.outcome }}
          PARITY_HEAP: ${{ steps.heap.outcome }}
          PARITY_COMPAT: ${{ steps.compat.outcome }}
          PARITY_TESTLAB: ${{ steps.testlab.outcome }}
          PARITY_GPU: ${{ steps.gpu.outcome }}
          PARITY_GPU_EMU: ${{ steps.gpu_emu.outcome }}
          PARITY_UIKIT_BUILD: ${{ steps.uikit_build.outcome }}
        run: python3 tools/private_fixture_parity.py --platform linux --out private-parity-summary.json
      - name: Upload only bounded parity JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-parity-${{ runner.os }}
          path: private-parity-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary fixture bytes
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ["HVM_FIXTURE_ROOT"])
          parent = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          if root.is_symlink() or root.parent.resolve() != parent or not root.name.startswith("hvm-private-fixtures-"):
              raise SystemExit("ERROR: refusing unexpected fixture cleanup path")
          if root.exists():
              shutil.rmtree(root)
          PY

  macos:
    needs: linux
    if: >-
      github.repository == 'lawsharley0-cyber/HydrogenVM' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      HVM_ALLOW_LEGACY_IPAS: "0"
    steps:
      - name: Set private fixture path after runner startup
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("hvm-private-fixtures-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          value = str(root)
          if "\n" in value or "\r" in value:
              raise SystemExit("ERROR: invalid runner temporary directory")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("HVM_FIXTURE_ROOT=" + value + "\n")
          PY
      - name: Check out this trusted main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate configuration without printing private IDs
        env:
          WIF_PROVIDER: ${{ vars.HVM_WIF_PROVIDER }}
          READER_ACCOUNT: ${{ vars.HVM_FIXTURE_SERVICE_ACCOUNT }}
          HVM_DRIVE_FOLDER_ID: ${{ secrets.HVM_DRIVE_FOLDER_ID }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          folder = os.environ["HVM_DRIVE_FOLDER_ID"]
          if re.fullmatch(r"[A-Za-z0-9_-]{10,}", folder):
              print("::add-mask::" + folder)
          checks = {
              "WIF provider": re.fullmatch(r"projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+", os.environ["WIF_PROVIDER"]),
              "reader account": re.fullmatch(r"[A-Za-z0-9_-]+@[A-Za-z0-9_-]+\.iam\.gserviceaccount\.com", os.environ["READER_ACCOUNT"]),
              "restricted folder": re.fullmatch(r"[A-Za-z0-9_-]{10,}", folder),
          }
          if not all(checks.values()):
              print("ERROR: required private fixture configuration is missing or invalid")
              sys.exit(1)
          PY
      - name: Existing synthetic downloader and resolver regressions
        run: |
          python3 -m unittest discover -s tools/compat_harness/tests -v
      - name: Use the existing keyless reader identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.HVM_WIF_PROVIDER }}
          service_account: ${{ vars.HVM_FIXTURE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Stage all three exact-hash private fixtures
        id: stage
        env:
          HVM_DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          HVM_DRIVE_FOLDER_ID: ${{ secrets.HVM_DRIVE_FOLDER_ID }}
        run: python3 tools/fetch_private_fixtures.py --root "$HVM_FIXTURE_ROOT"
      - name: Independently resolve every required fixture without legacy fallback
        id: resolve
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from compat_harness.manifest import default_manifest_path, load_manifest, resolve_app
          expected = {"angry-birds", "tiny-tower", "art-of-glow"}
          required = [a for a in load_manifest(default_manifest_path())["apps"] if not a.get("optional", False)]
          if {a["id"] for a in required} != expected:
              raise SystemExit("ERROR: required fixture set changed; review the migration gate")
          for app in required:
              result = resolve_app(app, repo=os.getcwd(), fixture_root=os.environ["HVM_FIXTURE_ROOT"], allow_legacy=False)
              if result["status"] != "resolved" or result["source"] != "fixture-root" or result["actualSha256"] != app["sha256"]:
                  raise SystemExit("ERROR: required private fixture did not resolve with its expected hash")
          print("Verified 3/3 required fixtures from fixture-root; legacy fallback disabled")
          PY
      - name: Install existing Apple build tools
        run: brew install cmake ninja llvm lld xcodegen
      - name: Retrieve only the synthetic UIKit guest from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: private-parity-synthetic-uikit
          path: build/ios/UIKitTest.app
      - name: Generate the production Xcode project
        working-directory: app
        run: xcodegen
      - name: Build production device target unsigned
        id: device_build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >device-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" device-build.log | head -200 || true
          exit "$rc"
      - name: Build production simulator target unsigned
        id: simulator_build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          xcodebuild -project HydrogenVM.xcodeproj -target HydrogenVM -configuration Release \
            -sdk iphonesimulator SUPPORTED_PLATFORMS="iphoneos iphonesimulator" ARCHS=arm64 \
            SYMROOT="$PWD/xbuild" CODE_SIGNING_ALLOWED=NO build >sim-build.log 2>&1 || rc=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim-build.log | head -200 || true
          exit "$rc"
      - name: UIKit synthetic simulator gate
        id: uikit
        run: |
          mkdir -p "$HVM_FIXTURE_ROOT/work"
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app build/ios/UIKitTest.app \
            "ALL CHECKS PASSED" "70,350@0.3;230,350@0.5" "$HVM_FIXTURE_ROOT/work/sim-uikit" > "$HVM_FIXTURE_ROOT/work/uikit-run.log" 2>&1 || { echo "ERROR: UIKit simulator gate failed"; exit 1; }
      - name: Stage exact-hash real guests for simulator scenarios
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "tools")
          from gpu_compare import app_from
          root = pathlib.Path(os.environ["HVM_FIXTURE_ROOT"])
          for name, target in (("Tiny_Tower_v1.0_os30.ipa", "tiny"), ("AngryBirds_v1.0_os30.ipa", "angry")):
              folder = root / "work" / target
              folder.mkdir(parents=True, exist_ok=True)
              app = app_from(str(root / "ipas" / name), str(folder))
              if "\n" in app or "\r" in app:
                  raise SystemExit("ERROR: unexpected guest bundle path")
              with open(os.environ["GITHUB_ENV"], "a") as out:
                  out.write("HVM_SIM_" + target.upper() + "=" + app + "\n")
          PY
      - name: Tiny Tower GPU frame 60 simulator parity
        id: tiny
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "$HVM_SIM_TINY" \
            "GPU: presented frame 60 directly" "160,240@6" "$HVM_FIXTURE_ROOT/work/sim-tiny" > "$HVM_FIXTURE_ROOT/work/tiny-run.log" 2>&1 || { echo "ERROR: Tiny Tower simulator frame gate failed"; exit 1; }
      - name: Angry Birds landscape GPU frame 600 simulator parity
        id: angry
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "$HVM_SIM_ANGRY" \
            "GPU: presented frame 600 directly" "" "$HVM_FIXTURE_ROOT/work/sim-angry" > "$HVM_FIXTURE_ROOT/work/angry-run.log" 2>&1 || { echo "ERROR: Angry Birds simulator frame gate failed"; exit 1; }
      - name: Tiny Tower GLES 1.1 on ES 2 simulator parity
        id: tiny_emu
        env:
          SIMCTL_CHILD_HVM_GL1_EMULATE: "1"
        run: |
          tools/sim_test.sh app/xbuild/Release-iphonesimulator/HydrogenVM.app "$HVM_SIM_TINY" \
            "GPU: presented frame 60 directly" "160,240@6" "$HVM_FIXTURE_ROOT/work/sim-tiny-emu" > "$HVM_FIXTURE_ROOT/work/tiny-emu-run.log" 2>&1 || { echo "ERROR: GLES 1.1 emulation simulator frame gate failed"; exit 1; }
      - name: Validate and retain bounded simulator parity evidence
        if: always()
        env:
          PARITY_STAGE: ${{ steps.stage.outcome }}
          PARITY_RESOLVE: ${{ steps.resolve.outcome }}
          PARITY_DEVICE_BUILD: ${{ steps.device_build.outcome }}
          PARITY_SIMULATOR_BUILD: ${{ steps.simulator_build.outcome }}
          PARITY_UIKIT: ${{ steps.uikit.outcome }}
          PARITY_TINY: ${{ steps.tiny.outcome }}
          PARITY_ANGRY: ${{ steps.angry.outcome }}
          PARITY_TINY_EMU: ${{ steps.tiny_emu.outcome }}
        run: python3 tools/private_fixture_parity.py --platform macos --out private-parity-summary.json
      - name: Upload only bounded parity JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-parity-${{ runner.os }}
          path: private-parity-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove simulator guest copies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices booted -j | python3 -c '
          import json, subprocess, sys
          for devices in json.load(sys.stdin)["devices"].values():
              for device in devices:
                  if device.get("state") == "Booted":
                      result = subprocess.run(["xcrun", "simctl", "uninstall", device["udid"], "com.lfull.HydrogenVM"], capture_output=True)
                      # A prior step may already have uninstalled the host.
                      if result.returncode and "No such file" not in result.stderr.decode(errors="replace"):
                          print("Simulator uninstall did not complete; hosted runner destruction remains the final cleanup boundary")
          '
      - name: Remove temporary fixture bytes
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ["HVM_FIXTURE_ROOT"])
          parent = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          if root.is_symlink() or root.parent.resolve() != parent or not root.name.startswith("hvm-private-fixtures-"):
              raise SystemExit("ERROR: refusing unexpected fixture cleanup path")
          if root.exists():
              shutil.rmtree(root)
          PY
